function formatTime(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function formatMoney(fee, currency) {
  return new Intl.NumberFormat("en-AU", { style: "currency", currency: currency || "AUD" }).format(fee);
}

const API_BASE = "http://localhost:4000/api";

// Uber's status vocabulary (pending/pickup/pickup_complete/dropoff/delivered/canceled)
// gets mapped onto the app's existing simplified status keys so StatusBadge,
// StatusTimeline, and the ongoing/history filters all keep working unchanged.
const PROVIDER_STATUS_MAP = {
  pending: "booked",
  pickup: "courier_assigned",
  pickup_complete: "picked_up",
  dropoff: "picked_up",
  delivered: "delivered",
  canceled: "cancelled",
  cancelled: "cancelled",
};

function normalizeProviderStatus(status) {
  return PROVIDER_STATUS_MAP[status] || status;
}

function mapDeliveryRecord(record) {
  return { ...record, status: normalizeProviderStatus(record.status) };
}

async function parseJsonResponse(response) {
  try {
    return await response.json();
  } catch {
    return {};
  }
}

// Loads the Maps JS API (Places library) using a key fetched from the backend
// rather than hardcoded here — see server/routes/config.js. Memoized so every
// AddressAutocompleteInput on the page shares one script load. Resolves false
// (never rejects) if there's no key or the script fails, so callers can fall
// back to a plain text input instead of breaking.
let mapsLoadPromise = null;
function loadGoogleMapsPlaces() {
  if (mapsLoadPromise) return mapsLoadPromise;
  mapsLoadPromise = fetch(`${API_BASE}/config/maps-key`)
    .then(async response => {
      const body = await parseJsonResponse(response);
      if (!response.ok || !body.apiKey) return false;
      if (window.google && window.google.maps && window.google.maps.places) return true;
      return new Promise(resolve => {
        // Use Google's `callback` param rather than the script's own onload —
        // with loading=async, onload fires before the places sub-library
        // chunk actually finishes, so google.maps.places isn't ready yet at
        // that point (confirmed live: onload fired but places was still
        // undefined). `callback` is what Google documents as firing only
        // once everything requested, including `libraries`, is really ready.
        const callbackName = "__routepointMapsReady";
        window[callbackName] = () => {
          delete window[callbackName];
          resolve(!!(window.google && window.google.maps && window.google.maps.places));
        };
        const script = document.createElement("script");
        script.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(body.apiKey) + "&libraries=places&callback=" + callbackName;
        script.async = true;
        script.onerror = () => resolve(false);
        document.head.appendChild(script);
      });
    })
    .catch(() => false);
  return mapsLoadPromise;
}

const inputClass = "w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 placeholder:text-slate-400";

// Address field with Google Places autocomplete when the Maps API is
// available, falling back to a plain text input otherwise (missing key,
// script failed to load, etc.) — never a broken field either way.
// Uses google.maps.places.PlaceAutocompleteElement, not the older
// google.maps.places.Autocomplete widget: as of March 2025 Google no longer
// grants the legacy widget to new API keys/customers, and this key is new.
function AddressAutocompleteInput({ value, onChange, placeholder, className }) {
  const containerRef = useRef(null);
  const widgetRef = useRef(null);
  const latestOnChange = useRef(onChange);
  latestOnChange.current = onChange;
  const [mapsAvailable, setMapsAvailable] = useState(null); // null = still deciding

  useEffect(() => {
    let cancelled = false;
    loadGoogleMapsPlaces().then(ok => {
      if (!cancelled) setMapsAvailable(ok);
    });
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (!mapsAvailable || !containerRef.current || widgetRef.current) return;

    const widget = new google.maps.places.PlaceAutocompleteElement();
    // The widget's internal shadow root is closed (confirmed live —
    // widget.shadowRoot is null), so styling/reading/writing through it
    // isn't possible. `.value` and `.placeholder` are real properties on the
    // element itself (confirmed live) and are the supported way in instead.
    widget.value = value || "";
    if (placeholder) widget.placeholder = placeholder;
    widget.style.colorScheme = "light"; // widget defaults to a dark theme otherwise
    widget.style.border = "1px solid #cbd5e1"; // matches inputClass's border-slate-300
    widget.style.borderRadius = "0.75rem"; // matches inputClass's rounded-xl
    widget.style.backgroundColor = "#ffffff";
    widget.style.display = "block";
    widget.style.width = "100%";
    containerRef.current.appendChild(widget);
    widgetRef.current = widget;

    function handleSelect(event) {
      const place = event.placePrediction.toPlace();
      place.fetchFields({ fields: ["formattedAddress"] }).then(() => {
        latestOnChange.current(place.formattedAddress || "");
      });
    }
    // Keeps free-typed text (no suggestion clicked) in sync too — "input" is
    // a composed event, so it crosses the widget's shadow DOM boundary even
    // though the shadow root itself is closed.
    function handleInput(event) {
      const text = event.target && event.target.value;
      if (typeof text === "string") latestOnChange.current(text);
    }

    widget.addEventListener("gmp-select", handleSelect);
    widget.addEventListener("input", handleInput);
    return () => {
      widget.removeEventListener("gmp-select", handleSelect);
      widget.removeEventListener("input", handleInput);
    };
  }, [mapsAvailable]);

  // Keeps the widget's displayed text in sync with `value` — needed because
  // several callers (Settings, New Delivery's pickup prefill) load their
  // initial value asynchronously, after this widget already exists.
  useEffect(() => {
    const widget = widgetRef.current;
    if (!widget) return;
    if (widget.value !== (value || "")) {
      widget.value = value || "";
    }
  }, [value, mapsAvailable]);

  if (mapsAvailable) {
    return <div ref={containerRef} className="w-full" />;
  }

  // mapsAvailable === false (no key / load failed) or still null (deciding) —
  // render a plain input either way so there's no flash of a broken control.
  return (
    <input
      className={className || inputClass}
      placeholder={placeholder}
      value={value}
      onChange={e => onChange(e.target.value)}
    />
  );
}

function useCountdown(targetIso) {
  const [, tick] = useState(0);
  useEffect(() => {
    if (!targetIso) return;
    const id = setInterval(() => tick(x => x + 1), 1000);
    return () => clearInterval(id);
  }, [targetIso]);
  if (!targetIso) return null;
  const remainingMs = new Date(targetIso).getTime() - Date.now();
  return Math.max(0, Math.floor(remainingMs / 1000));
}

function QuoteCard({ quote, onBook, bookLoading }) {
  const secs = useCountdown(quote.quoteExpiresAt);
  const mm = String(Math.floor((secs || 0) / 60)).padStart(2, "0");
  const ss = String((secs || 0) % 60).padStart(2, "0");
  const isExpired = secs === 0;

  return (
    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sticky top-24">
      <div className="flex items-center justify-between gap-2">
        <div className="text-sm font-semibold text-slate-500 uppercase tracking-wide">Delivery quote</div>
        <span className="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-700 whitespace-nowrap">
          Quote from {PROVIDER_LABELS[quote.provider] || quote.provider}
        </span>
      </div>
      <div className="mt-3 flex items-baseline gap-2">
        <span className="text-4xl font-extrabold text-slate-900">{formatMoney(quote.fee, quote.currency)}</span>
      </div>
      <div className="mt-4 space-y-2 text-slate-700">
        <div className="flex justify-between">
          <span className="text-slate-500">Estimated dropoff</span>
          <span className="font-semibold">{formatTime(quote.dropoffEta)}</span>
        </div>
        <div className="flex justify-between">
          <span className="text-slate-500">Quote expires in</span>
          <span className={"font-semibold " + (isExpired ? "text-red-600" : secs <= 60 ? "text-amber-600" : "text-slate-900")}>
            {isExpired ? "Expired" : mm + ":" + ss}
          </span>
        </div>
      </div>
      <button
        onClick={onBook}
        disabled={isExpired || bookLoading}
        className={
          "mt-6 w-full py-4 rounded-xl font-bold text-lg transition-colors " +
          (isExpired || bookLoading ? "bg-slate-200 text-slate-400 cursor-not-allowed" : "bg-blue-600 text-white hover:bg-blue-700 active:bg-blue-800")
        }
      >
        {isExpired ? "Quote expired — get a new one" : bookLoading ? "Booking…" : "Book Delivery"}
      </button>
    </div>
  );
}

function emptyDeliveryForm() {
  return {
    pickupAddress: DEFAULT_PICKUP_ADDRESS,
    dropoffAddress: "",
    customerName: "",
    customerPhone: "",
    orderRef: "",
    packageNotes: "",
    coldChain: false,
    customerSearch: "",
    selectedCustomerId: null,
    saveCustomer: false,
    specialInstructions: "",
    deliveryTiming: "asap", // "asap" | "scheduled"
    scheduledDate: "",
    scheduledTime: "",
  };
}

// Combines the form's separate date + time inputs into one ISO-8601 string
// for the backend, or null if either half is missing/invalid.
function combineScheduledForIso(scheduledDate, scheduledTime) {
  if (!scheduledDate || !scheduledTime) return null;
  const local = new Date(`${scheduledDate}T${scheduledTime}`);
  return isNaN(local.getTime()) ? null : local.toISOString();
}

function NewDeliveryForm({ customers, onBookDelivery, banner, onNavigate }) {
  const [form, setForm] = useState(emptyDeliveryForm);
  const [errors, setErrors] = useState({});
  const [quote, setQuote] = useState(null);
  const [apiError, setApiError] = useState(null);
  const [quoteLoading, setQuoteLoading] = useState(false);
  const [bookLoading, setBookLoading] = useState(false);
  const [availableProviders, setAvailableProviders] = useState(null);
  const [selectedProvider, setSelectedProvider] = useState(null);

  useEffect(() => {
    fetch(`${API_BASE}/providers`)
      .then(async response => {
        const body = await parseJsonResponse(response);
        if (!response.ok) throw new Error();
        const available = body.filter(p => p.enabled && p.working);
        setAvailableProviders(available);
        if (available.length === 1) setSelectedProvider(available[0].key);
      })
      .catch(() => setAvailableProviders([]));
  }, []);

  // Prefill pickup address from Settings, but never clobber an edit the
  // staff member already made while this was in flight.
  useEffect(() => {
    fetch(`${API_BASE}/settings/pickup-address`)
      .then(async response => {
        const body = await parseJsonResponse(response);
        if (!response.ok || !body.pickupAddress) return;
        setForm(f => (f.pickupAddress === DEFAULT_PICKUP_ADDRESS ? { ...f, pickupAddress: body.pickupAddress } : f));
      })
      .catch(() => {});
  }, []);

  const noProvidersAvailable = availableProviders !== null && availableProviders.length === 0;
  const selectedProviderInfo = availableProviders && availableProviders.find(p => p.key === selectedProvider);
  const schedulingSupported = !!(selectedProviderInfo && selectedProviderInfo.supportsScheduling);

  function update(field, value) {
    setForm(f => ({ ...f, [field]: value }));
    setQuote(null);
  }

  function handleProviderChange(key) {
    setSelectedProvider(key);
    const newProviderInfo = availableProviders && availableProviders.find(p => p.key === key);
    if (!newProviderInfo || !newProviderInfo.supportsScheduling) {
      setForm(f => ({ ...f, deliveryTiming: "asap", scheduledDate: "", scheduledTime: "" }));
    }
    setQuote(null);
  }

  const customerMatches = useMemo(() => {
    const term = form.customerSearch.trim().toLowerCase();
    if (!term || form.selectedCustomerId) return [];
    return customers
      .filter(c => c.name.toLowerCase().includes(term) || c.phone.toLowerCase().includes(term))
      .slice(0, 5);
  }, [form.customerSearch, form.selectedCustomerId, customers]);

  function handleSelectCustomer(customer) {
    setForm(f => ({
      ...f,
      customerName: customer.name,
      customerPhone: customer.phone,
      dropoffAddress: customer.address,
      selectedCustomerId: customer.id,
      customerSearch: "",
      saveCustomer: false,
    }));
    setQuote(null);
  }

  function handleClearCustomer() {
    setForm(f => ({ ...f, selectedCustomerId: null, customerSearch: "" }));
  }

  function validate() {
    const errs = {};
    if (!form.pickupAddress.trim()) errs.pickupAddress = "Pickup address is required.";
    if (!form.dropoffAddress.trim()) errs.dropoffAddress = "Dropoff address is required.";
    if (!form.customerName.trim()) errs.customerName = "Customer name is required.";
    if (!form.customerPhone.trim()) errs.customerPhone = "Customer phone is required.";
    if (!form.orderRef.trim()) errs.orderRef = "Order / script reference is required.";
    if (form.deliveryTiming === "scheduled" && schedulingSupported) {
      const iso = combineScheduledForIso(form.scheduledDate, form.scheduledTime);
      if (!iso) {
        errs.scheduledFor = "Choose a date and time to schedule for.";
      } else if (new Date(iso).getTime() <= Date.now()) {
        errs.scheduledFor = "Scheduled time must be in the future.";
      }
    }
    setErrors(errs);
    return Object.keys(errs).length === 0;
  }

  function scheduledForPayload() {
    return form.deliveryTiming === "scheduled" && schedulingSupported
      ? combineScheduledForIso(form.scheduledDate, form.scheduledTime)
      : null;
  }

  async function handleGetQuote() {
    if (!validate()) return;
    setApiError(null);
    setQuoteLoading(true);
    try {
      const response = await fetch(`${API_BASE}/quote`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          pickupAddress: form.pickupAddress.trim(),
          dropoffAddress: form.dropoffAddress.trim(),
          packageNotes: form.packageNotes.trim(),
          coldChain: form.coldChain,
          specialInstructions: form.specialInstructions.trim(),
          scheduledFor: scheduledForPayload(),
          provider: selectedProvider,
        }),
      });
      const body = await parseJsonResponse(response);
      if (!response.ok) {
        setApiError(body.message || "Could not get a delivery quote right now, please try again.");
        return;
      }
      setQuote(body);
    } catch {
      setApiError("Could not reach the delivery server. Please check it's running and try again.");
    } finally {
      setQuoteLoading(false);
    }
  }

  async function handleBook() {
    if (!quote) return;
    setApiError(null);
    setBookLoading(true);
    try {
      const response = await fetch(`${API_BASE}/deliveries`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          quoteId: quote.quoteId,
          orderRef: form.orderRef.trim(),
          customerName: form.customerName.trim(),
          customerPhone: form.customerPhone.trim(),
          customerId: form.selectedCustomerId,
          pickupAddress: form.pickupAddress.trim(),
          dropoffAddress: form.dropoffAddress.trim(),
          packageNotes: form.packageNotes.trim(),
          coldChain: form.coldChain,
          specialInstructions: form.specialInstructions.trim(),
          scheduledFor: scheduledForPayload(),
          provider: selectedProvider,
        }),
      });
      const body = await parseJsonResponse(response);
      if (!response.ok) {
        if (body.error === "QUOTE_EXPIRED") {
          setApiError("This quote has expired — please get a new quote before booking.");
          setQuote(null);
        } else {
          setApiError(body.message || "Could not book this delivery right now, please try again.");
        }
        return;
      }
      const delivery = mapDeliveryRecord(body);
      onBookDelivery(delivery, {
        saveNewCustomer: !form.selectedCustomerId && form.saveCustomer,
        newCustomerData: {
          name: delivery.customerName,
          phone: delivery.customerPhone,
          address: delivery.dropoffAddress,
          notes: "",
        },
      });
      setForm(emptyDeliveryForm());
      setQuote(null);
      setErrors({});
    } catch {
      setApiError("Could not reach the delivery server. Please check it's running and try again.");
    } finally {
      setBookLoading(false);
    }
  }

  return (
    <div className="max-w-6xl mx-auto px-4 py-8">
      {banner && (
        <div className="mb-6 bg-green-50 border border-green-300 text-green-800 rounded-xl px-5 py-4 font-semibold">
          {banner}
        </div>
      )}
      {apiError && (
        <div className="mb-6 bg-red-50 border border-red-300 text-red-800 rounded-xl px-5 py-4 font-semibold">
          {apiError}
        </div>
      )}
      {noProvidersAvailable && (
        <div className="mb-6 bg-amber-50 border border-amber-300 text-amber-900 rounded-xl px-5 py-4 font-semibold">
          No delivery providers are currently available.{" "}
          <button type="button" onClick={() => onNavigate("settings")} className="underline hover:no-underline">
            Check Settings for status.
          </button>
        </div>
      )}
      <h1 className="text-2xl font-bold text-slate-900 mb-6">New Delivery</h1>

function StorbieOrdersScreen() {
  const [orders, setOrders] = useState(null);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(true);
  const [printingRef, setPrintingRef] = useState(null);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    setError(null);
    fetch(`${API_BASE}/storbie/orders`)
      .then(async response => {
        const body = await parseJsonResponse(response);
        if (!response.ok) throw new Error(body.message || "Could not fetch orders from Storbie.");
        if (!cancelled) setOrders(body.orders);
      })
      .catch(err => {
        if (!cancelled) setError(err.message || "Could not reach the delivery server.");
      })
      .finally(() => {
        if (!cancelled) setLoading(false);
      });
    return () => { cancelled = true; };
  }, []);

  async function handlePrintLabel(order) {
    setError(null);
    setPrintingRef(order.orderRef);
    try {
      const response = await fetch(`${API_BASE}/storbie/orders/${encodeURIComponent(order.orderRef)}/create-label`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          customerName: order.customerName,
          customerPhone: order.customerPhone,
          address: order.address,
          items: order.items,
        }),
      });
      const body = await parseJsonResponse(response);
      if (!response.ok) {
        setError(body.message || "Could not create a label for this order right now.");
        return;
      }
      setOrders(prev => prev.map(o => (o.orderRef === order.orderRef ? { ...o, routePoint: body.routePoint } : o)));
    } catch {
      setError("Could not reach the delivery server. Please check it's running and try again.");
    } finally {
      setPrintingRef(null);
    }
  }

  const sortedOrders = useMemo(() => {
    if (!orders) return orders;
    return orders.slice().sort((a, b) => {
      const aNeeds = !(a.routePoint && a.routePoint.labelGenerated);
      const bNeeds = !(b.routePoint && b.routePoint.labelGenerated);
      if (aNeeds !== bNeeds) return aNeeds ? -1 : 1;
      return new Date(b.placedAt) - new Date(a.placedAt);
    });
  }, [orders]);

  return (
    <div className="max-w-6xl mx-auto px-4 py-8">
      <h1 className="text-2xl font-bold text-slate-900 mb-2">Storbie Orders</h1>
      <p className="text-slate-500 mb-6">
        Checkpoint view — proves the RoutePoint connection to Storbie works. Read-only, orders from the last 7 days.
        Label status below is RoutePoint's own record, not Storbie's order/delivery status.
      </p>

      {error && (
        <div className="mb-6 bg-red-50 border border-red-300 text-red-800 rounded-xl px-5 py-4 font-semibold">
          {error}
        </div>
      )}

      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-left">
            <thead className="bg-slate-50 border-b border-slate-200">
              <tr>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Order Ref</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Label</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Customer</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Phone</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Address</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Items</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Order Status</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Delivery Status</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Placed At</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {loading && (
                <tr>
                  <td colSpan="9" className="px-5 py-10 text-center text-slate-400 font-medium">Loading orders from Storbie…</td>
                </tr>
              )}
              {!loading && !error && sortedOrders && sortedOrders.length === 0 && (
                <tr>
                  <td colSpan="9" className="px-5 py-10 text-center text-slate-400 font-medium">No orders found in this window.</td>
                </tr>
              )}
              {!loading && sortedOrders && sortedOrders.map(o => (
                <tr key={o.orderRef}>
                  <td className="px-5 py-4 font-semibold text-slate-900">{o.orderRef}</td>
                  <td className="px-5 py-4">
                    <LabelStatusBadge
                      routePoint={o.routePoint}
                      printing={printingRef === o.orderRef}
                      onPrintLabel={() => handlePrintLabel(o)}
                    />
                  </td>
                  <td className="px-5 py-4 text-slate-700">{o.customerName || "—"}</td>
                  <td className="px-5 py-4 text-slate-700">{o.customerPhone || "—"}</td>
                  <td className="px-5 py-4 text-slate-500">{o.address || "—"}</td>
                  <td className="px-5 py-4 text-slate-700">
                    {o.items.map(i => `${i.quantity}× ${i.name}`).join(", ")}
                  </td>
                  <td className="px-5 py-4 text-slate-700">{o.orderStatus}</td>
                  <td className="px-5 py-4 text-slate-700">{o.deliveryStatus}</td>
                  <td className="px-5 py-4 text-slate-700 whitespace-nowrap">{new Date(o.placedAt).toLocaleString()}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function DeliveryHistoryTable({ deliveries, onSelect }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [fromDate, setFromDate] = useState("");
  const [toDate, setToDate] = useState("");

  const finished = deliveries.filter(d => d.status === "delivered" || d.status === "cancelled");

  const filtered = finished
    .filter(d => {
      if (statusFilter !== "all" && d.status !== statusFilter) return false;
      const term = search.trim().toLowerCase();
      if (term && !(d.customerName.toLowerCase().includes(term) || d.orderRef.toLowerCase().includes(term))) return false;
      const created = new Date(d.createdAt);
      if (fromDate && created < new Date(fromDate + "T00:00:00")) return false;
      if (toDate && created > new Date(toDate + "T23:59:59")) return false;
      return true;
    })
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const hasFilters = search || statusFilter !== "all" || fromDate || toDate;

  function clearFilters() {
    setSearch("");
    setStatusFilter("all");
    setFromDate("");
    setToDate("");
  }

  return (
    <div className="max-w-6xl mx-auto px-4 py-8">
      <h1 className="text-2xl font-bold text-slate-900 mb-6">Delivery History</h1>

      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 mb-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 items-end">
        <div className="lg:col-span-2">
          <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Search</label>
          <input
            className={inputClass}
            placeholder="Customer name or order ref"
            value={search}
            onChange={e => setSearch(e.target.value)}
          />
        </div>
        <div>
          <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Status</label>
          <select className={inputClass} value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
            <option value="all">All</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div>
          <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">From</label>
          <input type="date" className={inputClass} value={fromDate} onChange={e => setFromDate(e.target.value)} />
        </div>
        <div>
          <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">To</label>
          <input type="date" className={inputClass} value={toDate} onChange={e => setToDate(e.target.value)} />
        </div>
        {hasFilters && (
          <div className="lg:col-span-5">
            <button onClick={clearFilters} className="text-sm font-semibold text-blue-600 hover:underline">Clear filters</button>
          </div>
        )}
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-left">
            <thead className="bg-slate-50 border-b border-slate-200">
              <tr>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Date</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Order Ref</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Customer</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Address</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Status</th>
                <th className="px-5 py-4 text-xs font-bold text-slate-500 uppercase tracking-wide">Fee</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {filtered.length === 0 && (
                <tr>
                  <td colSpan="6" className="px-5 py-10 text-center text-slate-400 font-medium">
                    No deliveries match these filters.
                  </td>
                </tr>
              )}
              {filtered.map(d => (
                <tr
                  key={d.id}
                  onClick={() => onSelect(d.id)}
                  className="cursor-pointer hover:bg-blue-50 active:bg-blue-100 transition-colors"
                >
                  <td className="px-5 py-4 text-slate-700 whitespace-nowrap">{new Date(d.createdAt).toLocaleDateString()}</td>
                  <td className="px-5 py-4 font-semibold text-slate-900">
                    <div className="flex items-center gap-2">
                      {d.orderRef}
                      {d.coldChain && <span className="text-xs font-bold text-cyan-700">❄</span>}
                    </div>
                    <ProviderTag provider={d.provider} />
                  </td>
                  <td className="px-5 py-4 text-slate-700">{d.customerName}</td>
                  <td className="px-5 py-4 text-slate-500">{d.dropoffAddress}</td>
                  <td className="px-5 py-4"><StatusBadge status={d.status} /></td>
                  <td className="px-5 py-4 text-slate-700">{formatMoney(d.fee, d.currency)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

    phone: initial ? initial.phone : "",

    notes: initial ? initial.notes : "",

  function update(field, value) {
    setForm(f => ({ ...f, [field]: value }));

  function handleSave() {
    if (!form.name.trim() || !form.phone.trim()) {
      setError("Name and phone are required.");
      return;

    onSave({
      name: form.name.trim(),
      phone: form.phone.trim(),
      address: form.address.trim(),
      notes: form.notes.trim(),

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
        <h3 className="text-lg font-bold text-slate-900 mb-4">{initial ? "Edit Customer" : "Add Customer"}</h3>
        <div className="space-y-4">
          <Field label="Name">
            <input className={inputClass} value={form.name} onChange={e => update("name", e.target.value)} />
          </Field>
          <Field label="Phone">
            <input className={inputClass} type="tel" value={form.phone} onChange={e => update("phone", e.target.value)} />

function ReportsScreen({ deliveries }) {
  const [period, setPeriod] = useState("week");

  const periodStart = useMemo(() => {
    const start = new Date();
    if (period === "week") start.setDate(start.getDate() - 7);
    else start.setMonth(start.getMonth() - 1);
    return start;
  }, [period]);

  const inPeriod = useMemo(
    () => deliveries.filter(d => new Date(d.createdAt) >= periodStart),
    [deliveries, periodStart]
  );

  const totalCount = inPeriod.length;
  const cancelledCount = inPeriod.filter(d => d.status === "cancelled").length;
  const deliveredInPeriod = inPeriod.filter(d => d.status === "delivered");
  const totalFees = inPeriod.filter(d => d.status !== "cancelled").reduce((sum, d) => sum + d.fee, 0);
  const cancellationRate = totalCount > 0 ? (cancelledCount / totalCount) * 100 : 0;

  const avgDeliveryMinutes = useMemo(() => {
    const withTimes = deliveredInPeriod.filter(d => d.dropoffEta);
    if (withTimes.length === 0) return null;
    const totalMinutes = withTimes.reduce((sum, d) => sum + (new Date(d.dropoffEta) - new Date(d.createdAt)) / 60000, 0);
    return Math.round(totalMinutes / withTimes.length);
  }, [deliveredInPeriod]);

  const dayBuckets = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const date = new Date();
      date.setDate(date.getDate() - i);
      date.setHours(0, 0, 0, 0);
      days.push({ date, count: 0 });
    }
    deliveries.forEach(d => {
      const created = new Date(d.createdAt);
      created.setHours(0, 0, 0, 0);
      const bucket = days.find(b => b.date.getTime() === created.getTime());
      if (bucket) bucket.count += 1;
    });
    return days;
  }, [deliveries]);

  const maxCount = Math.max(1, ...dayBuckets.map(b => b.count));

  return (
    <div className="max-w-6xl mx-auto px-4 py-8">
      <div className="flex items-center justify-between flex-wrap gap-4 mb-6">
        <h1 className="text-2xl font-bold text-slate-900">Reports</h1>
        <div className="inline-flex rounded-xl bg-slate-100 p-1">
          {["week", "month"].map(p => (
            <button
              key={p}
              onClick={() => setPeriod(p)}
              className={
                "px-4 py-2 rounded-lg text-sm font-semibold capitalize transition-colors " +
                (period === p ? "bg-white text-blue-700 shadow" : "text-slate-600 hover:text-slate-900")
              }
            >
              This {p}
            </button>
          ))}
        </div>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <StatTile label={"Deliveries this " + period} value={totalCount} />
        <StatTile label={"Fees this " + period} value={formatMoney(totalFees, "AUD")} />
        <StatTile label="Avg. delivery time" value={avgDeliveryMinutes !== null ? avgDeliveryMinutes + " min" : "—"} caption="Booked to estimated dropoff" />
        <StatTile label="Cancellation rate" value={cancellationRate.toFixed(0) + "%"} caption={cancelledCount + " of " + totalCount + " orders"} />
      </div>

      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        <div className="text-sm font-bold text-slate-500 uppercase tracking-wide mb-6">Deliveries per day — last 7 days</div>
        <div className="flex items-end justify-between gap-3 sm:gap-6 h-40">
          {dayBuckets.map((b, i) => {
            const heightPct = Math.max(4, (b.count / maxCount) * 100);
            return (
              <div key={i} className="flex-1 flex flex-col items-center justify-end h-full group relative">
                <div className="mb-1 text-xs font-bold text-slate-700 opacity-0 group-hover:opacity-100 transition-opacity">
                  {b.count}
                </div>
                <div className="w-full max-w-10 bg-blue-600 rounded-t transition-all" style={{ height: heightPct + "%" }} />
                <div className="mt-2 text-xs font-semibold text-slate-500">
                  {b.date.toLocaleDateString([], { weekday: "short" })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function PickupLocationSection() {
  const [address, setAddress] = useState("");
  const [savedAddress, setSavedAddress] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    fetch(`${API_BASE}/settings/pickup-address`)
      .then(async response => {
        const body = await parseJsonResponse(response);
        if (!response.ok) throw new Error(body.message || "Could not load the pickup address.");
        setAddress(body.pickupAddress || "");
        setSavedAddress(body.pickupAddress || "");
      })
      .catch(err => setError(err.message || "Could not reach the delivery server."))
      .finally(() => setLoaded(true));
  }, []);

  async function handleSave() {
    setError(null);
    setSaved(false);
    setSaving(true);
    try {
      const response = await fetch(`${API_BASE}/settings/pickup-address`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pickupAddress: address.trim() }),
      });
      const body = await parseJsonResponse(response);
      if (!response.ok) {
        setError(body.message || "Could not save the pickup address.");
        return;
      }
      setSavedAddress(body.pickupAddress);
      setAddress(body.pickupAddress);
      setSaved(true);
    } catch {
      setError("Could not reach the delivery server. Please check it's running and try again.");
    } finally {
      setSaving(false);
    }
  }

  const dirty = address.trim() !== savedAddress;

  return (
    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-8">
      <h2 className="text-lg font-bold text-slate-900">Pickup Location</h2>
      <p className="text-slate-500 mt-1 mb-4">
        The default pharmacy pickup address prefilled on every new delivery. Staff can still override it per-delivery.
      </p>

      {error && (
        <div className="mb-4 bg-red-50 border border-red-300 text-red-800 rounded-xl px-4 py-3 text-sm font-semibold">
          {error}
        </div>
      )}
      {saved && !dirty && (
        <div className="mb-4 bg-green-50 border border-green-300 text-green-800 rounded-xl px-4 py-3 text-sm font-semibold">
          Saved.
        </div>
      )}

      {!loaded ? (
        <p className="text-slate-400">Loading…</p>
      ) : (
        <div className="flex flex-col sm:flex-row gap-3 sm:items-start">
          <div className="flex-1">
            <AddressAutocompleteInput
              className={inputClass}
              value={address}
              onChange={value => { setAddress(value); setSaved(false); }}
            />
          </div>
          <button
            onClick={handleSave}
            disabled={saving || !address.trim() || !dirty}
            className={
              "px-6 py-3 rounded-xl font-bold whitespace-nowrap transition-colors " +
              (saving || !address.trim() || !dirty ? "bg-slate-200 text-slate-400 cursor-not-allowed" : "bg-blue-600 text-white hover:bg-blue-700")
            }
          >
            {saving ? "Saving…" : "Save"}
          </button>
        </div>
      )}
    </div>
  );
}

function SettingsScreen() {
  const [providers, setProviders] = useState(null);
  const [error, setError] = useState(null);

  function loadProviders() {
    setError(null);
    fetch(`${API_BASE}/providers`)
      .then(async response => {
        const body = await parseJsonResponse(response);
        if (!response.ok) throw new Error(body.message || "Could not load provider settings.");
        setProviders(body);
      })
      .catch(err => setError(err.message || "Could not reach the delivery server."));
  }

  useEffect(() => {
    loadProviders();
  }, []);

  async function handleToggle(provider) {
    setError(null);
    try {
      const response = await fetch(`${API_BASE}/providers/${provider.key}/toggle`, { method: "POST" });
      const body = await parseJsonResponse(response);
      if (!response.ok) {
        setError(body.message || "Could not update this provider right now.");
        return;
      }
      setProviders(prev => prev.map(p => (p.key === provider.key ? body : p)));
    } catch {
      setError("Could not reach the delivery server. Please check it's running and try again.");
    }
  }

  return (
    <div className="max-w-4xl mx-auto px-4 py-8">
      <h1 className="text-2xl font-bold text-slate-900 mb-6">Settings</h1>

      <PickupLocationSection />

      <h2 className="text-lg font-bold text-slate-900 mb-2">Delivery Providers</h2>
      <p className="text-slate-500 mb-6">
        Enable or disable which providers staff can pick from in New Delivery. A provider can only be turned on once it's actually working.
      </p>

      {error && (
        <div className="mb-6 bg-red-50 border border-red-300 text-red-800 rounded-xl px-5 py-4 font-semibold">
          {error}
        </div>
      )}

      {!providers && !error && <p className="text-slate-400">Loading providers…</p>}

      <div className="space-y-4">
        {providers && providers.map(p => (
          <ProviderCard key={p.key} provider={p} onToggle={handleToggle} />
        ))}
      </div>
    </div>
  );
}

    <div className="flex items-start w-full py-2">
      {TIMELINE_STEPS.map((step, i) => {
        const done = i <= currentIndex;
        const isLast = i === TIMELINE_STEPS.length - 1;
        return (
          <React.Fragment key={step.key}>
            <div className="flex flex-col items-center text-center w-20 sm:w-28 shrink-0">
              <div className={
                "w-10 h-10 rounded-full flex items-center justify-center border-2 font-bold " +
                (done ? "bg-green-500 border-green-500 text-white" : "bg-white border-slate-300 text-slate-400")
              }>
                {done ? <CheckIcon /> : i + 1}
              </div>
              <span className={"mt-2 text-xs font-semibold leading-tight " + (done ? "text-slate-800" : "text-slate-400")}>
                {step.label}

            </div>
            {!isLast && (
              <div className={"flex-1 h-1 mt-5 rounded " + (i < currentIndex ? "bg-green-500" : "bg-slate-200")} />

          </React.Fragment>
        );
      })}

  );

            onClick={() => onAdvanceStatus(delivery.id)}
            className="px-6 py-3 rounded-xl font-semibold bg-slate-900 text-white hover:bg-slate-800"
            title="Demo-only control to preview status changes without a live backend"
          >
            Simulate next status (demo)
          </button>
        )}
        {canCancel && (
          <button
            onClick={() => setConfirming(true)}
            className="px-6 py-3 rounded-xl font-semibold bg-white border-2 border-red-300 text-red-700 hover:bg-red-50"
          >
            Cancel Delivery
          </button>
        )}
      </div>

      {confirming && (
        <ConfirmModal
          title="Cancel this delivery?"
          message={"This will cancel the delivery for order " + delivery.orderRef + ". This can't be undone."}
          confirmLabel="Cancel Delivery"
          cancelLabel="Keep Delivery"
          onCancel={() => setConfirming(false)}
          onConfirm={() => { onCancelDelivery(delivery.id); setConfirming(false); }}
        />
      )}
    </div>
  );
}

function App() {
  const [section, setSection] = useState("ongoing");
  const [originSection, setOriginSection] = useState("ongoing");
  const [deliveries, setDeliveries] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [banner, setBanner] = useState(null);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const deliveriesRef = useRef(deliveries);

  useEffect(() => {
    deliveriesRef.current = deliveries;
  }, [deliveries]);

  // Repopulate from the backend's persisted store on startup — customers and
  // deliveries live on disk now (see server/dataStore.js), not just in this
  // window's memory, so they survive app restarts/rebuilds/reinstalls.
  useEffect(() => {
    fetch(`${API_BASE}/deliveries`)
      .then(async response => {
        const body = await parseJsonResponse(response);
        if (!response.ok || !Array.isArray(body)) return;
        setDeliveries(body.map(mapDeliveryRecord));
      })
      .catch(() => {});

    fetch(`${API_BASE}/customers`)
      .then(async response => {
        const body = await parseJsonResponse(response);
        if (!response.ok || !Array.isArray(body)) return;
        setCustomers(body);
      })
      .catch(() => {});
  }, []);

  useEffect(() => {
    if (!banner) return;
    const id = setTimeout(() => setBanner(null), 4000);
    return () => clearTimeout(id);
  }, [banner]);

  // Poll Uber for live status on any delivery we actually booked through the
  // real API, while it's still in progress. Feeds both the Ongoing Deliveries
  // table and the Delivery Detail view, since they read from the same state.
  useEffect(() => {
    const interval = setInterval(async () => {
      const toPoll = deliveriesRef.current.filter(
        d => d.liveTracking && d.status !== "delivered" && d.status !== "cancelled"
      );
      if (toPoll.length === 0) return;

      const results = await Promise.all(
        toPoll.map(async d => {
          try {
            const response = await fetch(`${API_BASE}/deliveries/${d.id}`);
            if (!response.ok) return null;
            const body = await parseJsonResponse(response);
            return mapDeliveryRecord(body);
          } catch {
            return null;
          }
        })
      );

      const updates = results.filter(Boolean);
      if (updates.length === 0) return;

      setDeliveries(prev =>
        prev.map(d => {
          const match = updates.find(u => u.id === d.id);
          return match ? { ...d, ...match } : d;
        })
      );
    }, 15000);

    return () => clearInterval(interval);
  }, []);

  async function handleBookDelivery(delivery, options) {
    let finalDelivery = delivery;

    if (options && options.saveNewCustomer) {
      try {
        const response = await fetch(`${API_BASE}/customers`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(options.newCustomerData),
        });
        const newCustomer = await parseJsonResponse(response);
        if (response.ok) {
          setCustomers(prev => [...prev, newCustomer]);
          finalDelivery = { ...delivery, customerId: newCustomer.id };
        }
      } catch {
        // The delivery itself is already booked — don't block on this,
        // just skip saving/linking the customer.
      }
    } else if (delivery.customerId) {
      fetch(`${API_BASE}/customers/${delivery.customerId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lastDeliveryAt: delivery.createdAt }),
      })
        .then(async response => {
          if (!response.ok) return;
          const updated = await parseJsonResponse(response);
          setCustomers(prev => prev.map(c => (c.id === delivery.customerId ? updated : c)));
        })
        .catch(() => {});
    }

    setDeliveries(prev => [finalDelivery, ...prev]);
    setBanner("Delivery booked for order " + finalDelivery.orderRef + ".");
    setSection("ongoing");
  }

  function handleSelect(id, fromSection) {
    setSelectedId(id);
    setOriginSection(fromSection);
    setSection("detail");
  }

  async function handleCancelDelivery(id) {
    const target = deliveriesRef.current.find(d => d.id === id);

    if (target && target.liveTracking) {
      try {
        const response = await fetch(`${API_BASE}/deliveries/${id}/cancel`, { method: "POST" });
        const body = await parseJsonResponse(response);
        if (!response.ok) {
          setBanner(body.message || "Could not cancel this delivery right now, please try again.");
          return;
        }
        const mapped = mapDeliveryRecord(body);
        setDeliveries(prev => prev.map(d => (d.id === id ? { ...d, ...mapped } : d)));
      } catch {
        setBanner("Could not reach the delivery server to cancel this order. Please try again.");
      }
      return;
    }

    setDeliveries(prev => prev.map(d => d.id === id ? { ...d, status: "cancelled", courierName: null, courierPhone: null, trackingUrl: null } : d));
  }

  function handleAdvanceStatus(id) {
    setDeliveries(prev => prev.map(d => {
      if (d.id !== id) return d;
      const idx = TIMELINE_STEPS.findIndex(s => s.key === d.status);
      const next = TIMELINE_STEPS[idx + 1];
      if (!next) return d;
      if (next.key === "courier_assigned" && !d.courierName) {
        const courier = COURIER_POOL[Math.floor(Math.random() * COURIER_POOL.length)];
        return {
          ...d,
          status: next.key,
          courierName: courier.name,
          courierPhone: courier.phone,
          trackingUrl: "https://track.uber.com/mock/" + d.id,
        };
      }
      return { ...d, status: next.key };
    }));
  }

  async function handleAddCustomer(values) {
    try {
      const response = await fetch(`${API_BASE}/customers`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(values),
      });
      const body = await parseJsonResponse(response);
      if (!response.ok) {
        setBanner(body.message || "Could not save this customer right now.");
        return;
      }
      setCustomers(prev => [...prev, body]);
    } catch {
      setBanner("Could not reach the delivery server. Please check it's running and try again.");
    }
  }

  async function handleUpdateCustomer(id, values) {
    try {
      const response = await fetch(`${API_BASE}/customers/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(values),
      });
      const body = await parseJsonResponse(response);
      if (!response.ok) {
        setBanner(body.message || "Could not update this customer right now.");
        return;
      }
      setCustomers(prev => prev.map(c => (c.id === id ? body : c)));
    } catch {
      setBanner("Could not reach the delivery server. Please check it's running and try again.");
    }
  }

  async function handleDeleteCustomer(id) {
    try {
      const response = await fetch(`${API_BASE}/customers/${id}`, { method: "DELETE" });
      if (!response.ok) {
        const body = await parseJsonResponse(response);
        setBanner(body.message || "Could not delete this customer right now.");
        return;
      }
      setCustomers(prev => prev.filter(c => c.id !== id));
    } catch {
      setBanner("Could not reach the delivery server. Please check it's running and try again.");
    }
  }

  function navigate(key) {
    setSection(key);
    setMobileNavOpen(false);
  }

  const activeCount = deliveries.filter(d => d.status !== "delivered" && d.status !== "cancelled").length;
  const selectedDelivery = deliveries.find(d => d.id === selectedId) || null;
  const sidebarActiveKey = section === "detail" ? originSection : section;

  return (
    <div className="min-h-screen">
      <Sidebar
        activeSection={sidebarActiveKey}
        onNavigate={navigate}
        onNewDelivery={() => { setSection("new"); setMobileNavOpen(false); }}
        activeCount={activeCount}
        mobileOpen={mobileNavOpen}
        onCloseMobile={() => setMobileNavOpen(false)}
      />
      <div className="md:pl-72">
        <MobileTopBar onOpenMenu={() => setMobileNavOpen(true)} />
        {section === "new" && <NewDeliveryForm customers={customers} onBookDelivery={handleBookDelivery} banner={banner} onNavigate={navigate} />}
        {section === "ongoing" && <OngoingDeliveriesTable deliveries={deliveries} onSelect={id => handleSelect(id, "ongoing")} />}
        {section === "history" && <DeliveryHistoryTable deliveries={deliveries} onSelect={id => handleSelect(id, "history")} />}
        {section === "customers" && (
          <CustomersScreen
            customers={customers}
            deliveries={deliveries}
            onAdd={handleAddCustomer}
            onUpdate={handleUpdateCustomer}
            onDelete={handleDeleteCustomer}
          />
        )}
        {section === "reports" && <ReportsScreen deliveries={deliveries} />}
        {section === "settings" && <SettingsScreen />}
        {section === "storbie" && <StorbieOrdersScreen />}
        {section === "detail" && (
          <DeliveryDetail
            delivery={selectedDelivery}
            backLabel={"Back to " + (originSection === "history" ? "Delivery History" : "Ongoing Deliveries")}
            onBack={() => setSection(originSection)}
            onCancelDelivery={handleCancelDelivery}
            onAdvanceStatus={handleAdvanceStatus}
          />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
